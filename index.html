<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abfahrtstafel Kiosk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #e2001a; text-align: center; margin-bottom: 5px; transition: color 0.3s; }
        
        .kiosk-bar {
            width: 100%; max-width: 1000px;
            display: flex; justify-content: space-between; align-items: center;
            background: #333; color: white; padding: 12px 20px;
            border-radius: 8px; margin-bottom: 15px;
            box-sizing: border-box; font-size: 18px; font-weight: bold;
        }
        .price-tag { color: #ffcc00; }
        .card-info { color: #00ffcc; }
        .logout-btn { background: #555; padding: 6px 12px; font-size: 14px; border-radius: 4px; margin-left: 10px; border:none; color:white; cursor:pointer;}
        .logout-btn:hover { background: #b30015; }

        .controls {
            margin-bottom: 20px; display: flex; flex-wrap: wrap;
            gap: 15px; justify-content: center; align-items: center;
        }
        select, button { padding: 15px 20px; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; outline: none; }
        button { background-color: #e2001a; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #b30015; }
        button:disabled { background-color: #777; cursor: not-allowed; }

        table { width: 100%; max-width: 1000px; border-collapse: collapse; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 18px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #e2001a; color: white; }
        .delay { color: #e2001a; font-weight: bold; }
        .info-text { font-size: 0.85em; color: #e2001a; }
        .print-chkbx { width: 25px; height: 25px; cursor: pointer; }

        /* ADMIN OVERLAY */
        .admin-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; color: white;
        }
        .admin-box { background: #222; padding: 30px; border-radius: 12px; border: 2px solid #e2001a; text-align: center; max-width: 500px; width: 90%; max-height: 95vh; overflow-y: auto; }
        .admin-box h2 { color: #e2001a; margin-top: 0; }
        .admin-box input { padding: 10px; font-size: 22px; width: 60%; margin: 10px 0; text-align: center; border-radius: 5px; border: 2px solid #555; background: #fff; color: #000; cursor: pointer; }
        .admin-box input.active-input { border-color: #e2001a; box-shadow: 0 0 8px rgba(226, 0, 26, 0.5); }
        .admin-btn { width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; }
        .btn-sys { background-color: #444; color: #fff; }
        .btn-sys:hover { background-color: #555; }
        .btn-close { background-color: #333; margin-top: 15px; }
        .sub-box { background: #111; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #444; }

        /* NUMPAD */
        .numpad-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            max-width: 250px; margin: 15px auto; background: #1a1a1a;
            padding: 10px; border-radius: 8px; border: 1px solid #444;
        }
        .numpad-btn { background: #333; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .numpad-btn:active { background: #e2001a; }
        .numpad-btn.btn-action { background: #555; font-size: 16px; }
        .numpad-btn.btn-action:active { background: #b30015; }
    </style>
</head>
<body>

    <div class="kiosk-bar">
        <div>Karte: <span id="cardDisplay" class="card-info">Keine Karte</span>
             <button id="logoutBtn" class="logout-btn" onclick="logoutCard()" style="display:none;">Abmelden ❌</button>
        </div>
        <div>Guthaben: <span id="guthabenDisplay">0,00 €</span></div>
        <div>Druckpreis: <span id="preisDisplay" class="price-tag">0,50 €</span></div>
    </div>

    <h1 id="stationTitle">Abfahrtstafel</h1>
    
    <div class="controls">
        <select id="stationSelect" onchange="ladeAbfahrten()"></select>
        <button onclick="ladeAbfahrten()">Aktualisieren 🔄</button>
        <button id="printBtn" onclick="druckeFahrplan()" disabled>Bitte Karte auflegen 🖨️</button>
    </div>

    <table id="abfahrtenTable">
        <thead>
            <tr><th style="width: 50px; text-align: center;">Druck</th><th>Zeit</th><th>Linie</th><th>Ziel</th><th>Gl.</th></tr>
        </thead>
        <tbody><tr><td colspan="5">Bitte Station wählen...</td></tr></tbody>
    </table>

    <div id="adminOverlay" class="admin-overlay">
        <div class="admin-box">
            <h2>SYSTEM ADMIN MENÜ</h2>
            <hr style="border-color:#e2001a;">
            
            <p>Automaten-Druckpreis ändern (€):</p>
            <input type="text" id="inputPreis" readonly placeholder="0.00" onclick="setActiveInput('inputPreis')">
            <button class="admin-btn" onclick="speichereNeuenPreis()">Preis Speichern</button>
            
            <div class="sub-box">
                <h3>💳 Karten-Aufladestation</h3>
                <p id="adminCardStatus">Bitte Kundenkarte auf den Leser legen...</p>
                <div id="chargeControls" style="display: none;">
                    <input type="text" id="inputAufladen" readonly placeholder="0.00" onclick="setActiveInput('inputAufladen')"><br>
                    <button class="admin-btn" style="background:#00b386;" onclick="sendeAufladung()">Guthaben aufladen</button>
                </div>
                <button class="admin-btn btn-sys" style="margin-top:10px; font-size:14px;" onclick="starteAdminLernen()">🔄 Neue Admin-Karte einlernen</button>
            </div>

            <div class="numpad-container" id="numpad">
                <button class="numpad-btn" onclick="numpadInput('1')">1</button>
                <button class="numpad-btn" onclick="numpadInput('2')">2</button>
                <button class="numpad-btn" onclick="numpadInput('3')">3</button>
                <button class="numpad-btn" onclick="numpadInput('4')">4</button>
                <button class="numpad-btn" onclick="numpadInput('5')">5</button>
                <button class="numpad-btn" onclick="numpadInput('6')">6</button>
                <button class="numpad-btn" onclick="numpadInput('7')">7</button>
                <button class="numpad-btn" onclick="numpadInput('8')">8</button>
                <button class="numpad-btn" onclick="numpadInput('9')">9</button>
                <button class="numpad-btn" onclick="numpadInput('.')">.</button>
                <button class="numpad-btn" onclick="numpadInput('0')">0</button>
                <button class="numpad-btn btn-action" onclick="numpadInput('clear')">⌫</button>
            </div>
            
            <h3 style="color:#e2001a; margin-top:20px;">🖥️ System-Steuerung</h3>
            <button class="admin-btn btn-sys" onclick="systemAktion('reboot')">🔄 System Neustarten</button>
            <button class="admin-btn" style="background:#b30015;" onclick="systemAktion('shutdown')">🛑 Herunterfahren</button>
            
            <button class="admin-btn btn-close" onclick="schließeAdminMenü()">Schließen</button>
        </div>
    </div>

    <script>
        const GITHUB_BASE_URL = "https://raw.githubusercontent.com/nicopro2021/Abfahrtstafel-/main/";
        let aktuelleAbfahrten = [];
        let aktuellerDruckpreis = 0.50;
        let aktiveCardUID = null;
        let isAdminOpen = false;
        let ausgewählteAdminKundenUID = null;
        let blockNfcPolling = false;
        let currentActiveInputId = null;

        const LOCAL_STATIONS = [
            { name: "Bad Belzig", file: "bad_belzig.json" }, { name: "Berlin Hbf", file: "berlin_hbf.json" },
            { name: "Biederitz", file: "biederitz.json" }, { name: "Bitterfeld", file: "bitterfeld.json" },
            { name: "Brandenburg Hbf", file: "brandenburg_hbf.json" }, { name: "Dessau Hbf", file: "dessau_hbf.json" },
            { name: "Dessau Süd", file: "dessau_sued.json" }, { name: "Gommern", file: "gommern.json" },
            { name: "Güterglück", file: "gueterglueck.json" }, { name: "Leipzig Hbf", file: "leipzig_hbf.json" },
            { name: "Leipzig Hbf (tief)", file: "leipzig_hbf_tief.json" }, { name: "Magdeburg Hbf", file: "magdeburg_hbf.json" },
            { name: "Magdeburg Herrenkrug", file: "magdeburg_herrenkrug.json" }, { name: "Magdeburg Neustadt", file: "magdeburg_neustadt.json" },
            { name: "Pretzier (Altm)", file: "pretzier_altm.json" }, { name: "Rodleben", file: "rodleben.json" },
            { name: "Roßlau (Elbe)", file: "rosslau.json" }, { name: "Wolfen", file: "wolfen.json" },
            { name: "Wusterwitz", file: "wusterwitz.json" }, { name: "Zerbst/Anhalt", file: "zerbst.json" }
        ];

        function initDropdown() {
            const select = document.getElementById('stationSelect');
            LOCAL_STATIONS.forEach(station => {
                const option = document.createElement('option');
                option.value = station.file; option.textContent = station.name;
                if (station.name === "Zerbst/Anhalt") option.selected = true;
                select.appendChild(option);
            });
        }

        // Begrenzung der Checkboxen auf maximal 6
        function handleCheckboxChange(cb) {
            const checkedBoxes = document.querySelectorAll('.print-chkbx:checked');
            if (checkedBoxes.length > 6) {
                cb.checked = false;
                alert("Du kannst maximal 6 Verbindungen für den Ausdruck auswählen!");
            }
        }

        async function ladeAbfahrten() {
            const select = document.getElementById('stationSelect');
            const tbody = document.querySelector('#abfahrtenTable tbody');
            tbody.innerHTML = '<tr><td colspan="5">Daten werden geladen...</td></tr>';
            try {
                const response = await fetch(GITHUB_BASE_URL + select.value);
                const data = await response.json();
                tbody.innerHTML = '';
                const fahrten = Array.isArray(data) ? data : (data.abfahrten || []); 
                aktuelleAbfahrten = fahrten; 
                if (fahrten.length === 0) { tbody.innerHTML = '<tr><td colspan="5">Keine aktuellen Abfahrten.</td></tr>'; return; }
                
                fahrten.forEach((zug, index) => {
                    const tr = document.createElement('tr');
                    let zAnzeige = zug.zeit || '-';
                    if (zug.echte_zeit && zug.echte_zeit !== zug.zeit) zAnzeige += ` <br><span class="delay">(heute ${zug.echte_zeit})</span>`;
                    let zInfo = "";
                    if (zug.info && zug.info.toLowerCase() !== "pünktlich") {
                        zInfo = `<br><span class="info-text">⚠ ${zug.info}${zug.begruendung ? ' - ' + zug.begruendung : ''}</span>`;
                    }
                    tr.innerHTML = `
                        <td style="text-align: center;"><input type="checkbox" class="print-chkbx" data-index="${index}" onchange="handleCheckboxChange(this)"></td>
                        <td>${zAnzeige}</td><td><strong>${zug.linie || '-'}</strong></td><td>${zug.ziel || '-'}${zInfo}</td><td>${zug.gleis || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) { tbody.innerHTML = '<tr><td colspan="5" style="color:red;">Fehler beim Laden von GitHub.</td></tr>'; }
        }

        async function druckeFahrplan() {
            if (!aktiveCardUID || blockNfcPolling) return;
            
            const checkboxen = document.querySelectorAll('.print-chkbx');
            let gewaehlteZuege = [];
            
            checkboxen.forEach(box => {
                if (box.checked) {
                    gewaehlteZuege.push(aktuelleAbfahrten[parseInt(box.getAttribute('data-index'))]);
                }
            });

            // Fallback: Wenn nichts ausgewählt wurde, drucke die ersten 6 Verbindungen
            if (gewaehlteZuege.length === 0) {
                gewaehlteZuege = aktuelleAbfahrten.slice(0, 6);
            }

            blockNfcPolling = true;

            try {
                const resAbbuchen = await fetch('http://127.0.0.1:5000/abbuchen', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: aktiveCardUID })
                });
                const datenAbbuchen = await resAbbuchen.json();
                
                if(datenAbbuchen.status === "success") {
                    document.getElementById('guthabenDisplay').textContent = datenAbbuchen.guthaben.toFixed(2).replace('.', ',') + " €";
                    
                    const select = document.getElementById('stationSelect');
                    await fetch('http://127.0.0.1:5000/print-abfahrten', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            station: select.options[select.selectedIndex].text, 
                            abfahrten: gewaehlteZuege,
                            wurde_gefiltert: (gewaehlteZuege.length !== aktuelleAbfahrten.length)
                        })
                    });
                    
                    setTimeout(() => {
                        logoutCard();
                        blockNfcPolling = false;
                        ladeAbfahrten(); // Setzt die Checkboxen zurück
                    }, 2000);
                } else { 
                    alert(datenAbbuchen.message); 
                    blockNfcPolling = false;
                }
            } catch (error) { 
                alert("Transaktion fehlgeschlagen."); 
                blockNfcPolling = false;
            }
        }

        function logoutCard() {
            aktiveCardUID = null;
            document.getElementById('cardDisplay').textContent = "Keine Karte";
            document.getElementById('guthabenDisplay').textContent = "0,00 €";
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('printBtn').disabled = true;
            document.getElementById('printBtn').textContent = "Bitte Karte auflegen 🖨️";
        }

        // Steuerung der aktiven Eingabefelder für das Numpad
        function setActiveInput(inputId) {
            if (currentActiveInputId) {
                document.getElementById(currentActiveInputId).classList.remove('active-input');
            }
            currentActiveInputId = inputId;
            document.getElementById(inputId).classList.add('active-input');
        }

        function numpadInput(wert) {
            if (!currentActiveInputId) return;
            const inputField = document.getElementById(currentActiveInputId);
            let aktuellerWert = inputField.value;

            if (wert === 'clear') {
                inputField.value = aktuellerWert.slice(0, -1);
            } else if (wert === '.') {
                if (!aktuellerWert.includes('.')) {
                    inputField.value += wert;
                }
            } else {
                if (aktuellerWert.includes('.')) {
                    const teile = aktuellerWert.split('.');
                    if (teile[1].length >= 2) return; // Maximal 2 Nachkommastellen
                }
                inputField.value += wert;
            }
        }

        async function checkNFC() {
            if (blockNfcPolling) return;

            try {
                const response = await fetch('http://127.0.0.1:5000/get-nfc');
                const data = await response.json();
                
                document.getElementById('stationTitle').style.color = "#e2001a";
                document.getElementById('stationTitle').textContent = "Abfahrtstafel";

                if (data.preis) {
                    aktuellerDruckpreis = data.preis;
                    document.getElementById('preisDisplay').textContent = aktuellerDruckpreis.toFixed(2).replace('.', ',') + " €";
                }

                if (data.status === "admin_hold") {
                    isAdminOpen = true;
                    document.getElementById('inputPreis').value = aktuellerDruckpreis.toFixed(2);
                    document.getElementById('adminOverlay').style.display = 'flex';
                    setActiveInput('inputPreis'); // Preis-Feld standardmäßig für Tastatur aktivieren
                } 
                else if (data.status === "admin_learned") {
                    alert("Erfolgreich! Neue Admin-Karte registriert. Schließe Menü.");
                    schließeAdminMenü();
                }
                else if (data.status === "user_card") {
                    if (isAdminOpen) {
                        ausgewählteAdminKundenUID = data.uid;
                        document.getElementById('adminCardStatus').innerHTML = `Gewählt: <b>${data.card_name}</b><br>Guthaben: ${data.guthaben.toFixed(2)} €`;
                        document.getElementById('chargeControls').style.display = 'block';
                        document.getElementById('inputAufladen').value = "";
                        setActiveInput('inputAufladen'); // Fokus automatisch auf das Aufladen-Feld setzen
                    } else {
                        aktiveCardUID = data.uid;
                        document.getElementById('cardDisplay').textContent = data.card_name;
                        document.getElementById('guthabenDisplay').textContent = data.guthaben.toFixed(2).replace('.', ',') + " €";
                        document.getElementById('logoutBtn').style.display = 'inline-block';
                        
                        const printBtn = document.getElementById('printBtn');
                        if (data.guthaben >= aktuellerDruckpreis) {
                            printBtn.disabled = false; printBtn.textContent = "Fahrplan Drucken 🖨️";
                        } else {
                            printBtn.disabled = true; printBtn.textContent = "Guthaben zu gering!";
                        }
                    }
                }
            } catch (e) { 
                document.getElementById('stationTitle').style.color = "blue"; 
                document.getElementById('stationTitle').textContent = "Abfahrtstafel (Server offline/blockiert)";
            }
        }

        async function starteAdminLernen() {
            if(confirm("Möchtest du die nächste Karte, die aufgelegt wird, als neue Master-Admin-Karte speichern?")) {
                document.getElementById('adminCardStatus').innerHTML = "⏳ <b>Warte auf neue Admin-Karte... Jetzt auflegen!</b>";
                await fetch('http://127.0.0.1:5000/set-admin-mode', { method: 'POST' });
            }
        }

        async function sendeAufladung() {
            if (!ausgewählteAdminKundenUID) return;
            const betrag = parseFloat(document.getElementById('inputAufladen').value);
            if (isNaN(betrag) || betrag <= 0) return;

            try {
                const response = await fetch('http://127.0.0.1:5000/aufladen', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: ausgewählteAdminKundenUID, betrag: betrag })
                });
                const res = await response.json();
                if(res.status === "success") {
                    alert("Erfolgreich aufgeladen!");
                    document.getElementById('inputAufladen').value = "";
                    document.getElementById('adminCardStatus').textContent = "Bitte Kundenkarte auf den Leser legen...";
                    document.getElementById('chargeControls').style.display = 'none';
                    ausgewählteAdminKundenUID = null;
                    setActiveInput('inputPreis'); // Fokus zurück auf Preis setzen
                }
            } catch (e) { alert("Fehler beim Aufladen."); }
        }

        async function speichereNeuenPreis() {
            const neuerPreis = parseFloat(document.getElementById('inputPreis').value);
            if (isNaN(neuerPreis)) {
                alert("Bitte einen gültigen Preis eingeben.");
                return;
            }
            try {
                const response = await fetch('http://127.0.0.1:5000/set-preis', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ preis: neuerPreis })
                });
                const res = await response.json();
                if(res.status === "success") { schließeAdminMenü(); }
            } catch (e) { alert("Fehler beim Speichern des Preises."); }
        }

        async function systemAktion(typ) {
            const msg = typ === "shutdown" ? "System wirklich HERUNTERFAHREN?" : "System wirklich NEUSTARTEN?";
            if(confirm(msg)) {
                try { await fetch('http://127.0.0.1:5000/system-control', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: typ })
                }); } catch(e) {}
            }
        }

        function schließeAdminMenü() { 
            isAdminOpen = false;
            ausgewählteAdminKundenUID = null;
            currentActiveInputId = null;
            
            const inputs = document.querySelectorAll('.admin-box input');
            inputs.forEach(input => input.classList.remove('active-input'));

            document.getElementById('chargeControls').style.display = 'none';
            document.getElementById('adminCardStatus').textContent = "Bitte Kundenkarte auf den Leser legen...";
            document.getElementById('adminOverlay').style.display = 'none'; 
            logoutCard();
        }

        initDropdown();
        ladeAbfahrten();
        setInterval(ladeAbfahrten, 60000);
        setInterval(checkNFC, 1500);
    </script>
</body>
</html>
