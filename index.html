<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Fahrkartenautomat Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="automat">
        <div class="screen">
            <div class="header">
                <div class="db-logo">DB</div>
                <h2>Fahrkarten & Reservierungen</h2>
                <div id="uhrzeit">00:00</div>
            </div>
            
            <div class="content" id="display">
                <h3>Verbund- und Regionaltarife</h3>
                
                <div class="button-grid">
                    <button class="btn-db" onclick="waehleZiel('Berlin Hbf', 24.50)">
                        <span>Berlin Hbf</span>
                        <span class="preis-tag">24,50 €</span>
                    </button>
                    <button class="btn-db" onclick="waehleZiel('Magdeburg Hbf', 12.00)">
                        <span>Magdeburg Hbf</span>
                        <span class="preis-tag">12,00 €</span>
                    </button>
                    <button class="btn-db" onclick="waehleZiel('Zerbst/Anhalt', 4.20)">
                        <span>Zerbst/Anhalt</span>
                        <span class="preis-tag">4,20 €</span>
                    </button>
                    <button class="btn-db" onclick="waehleZiel('Halle (Saale) Hbf', 18.90)">
                        <span>Halle (Saale) Hbf</span>
                        <span class="preis-tag">18,90 €</span>
                    </button>
                </div>
            </div>
            
            <div class="footer-nav" id="navigation">
                <button class="btn-nav" onclick="location.reload()">🏠 Start</button>
                <button class="btn-nav">🌐 Sprache / Language</button>
                <button class="btn-nav">❓ Hilfe</button>
            </div>
        </div>
        
        <div class="hardware-leiste">
            <div>💳 Karten-Terminal</div>
            <div>🪙 Münzeinwurf</div>
            <div>🎟️ Ticket-Ausgabe</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
