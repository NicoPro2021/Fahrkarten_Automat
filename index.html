<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abfahrtstafel</title>
    <style>
        /* =========================================
           BILDSCHIRM-ANSICHT (Touch-Display)
           ========================================= */
        @media screen {
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f9;
                color: #333;
                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            h1 { color: #e2001a; text-align: center; }
            .controls {
                margin-bottom: 20px;
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
                align-items: center;
            }
            select, button {
                padding: 15px 20px;
                font-size: 18px;
                border-radius: 8px;
                border: 1px solid #ccc;
                outline: none;
            }
            button {
                background-color: #e2001a;
                color: white;
                border: none;
                cursor: pointer;
                font-weight: bold;
            }
            button:hover { background-color: #b30015; }
            table {
                width: 100%;
                max-width: 1000px;
                border-collapse: collapse;
                background: white;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                font-size: 18px;
            }
            th, td {
                padding: 15px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            th { background-color: #333; color: white; }
            .delay { color: #e2001a; font-weight: bold; }
            .info-text { font-size: 0.85em; color: #e2001a; }
            #printFooter { display: none; }
        }

        /* =========================================
           THERMODRUCKER-ANSICHT (Bon-Drucker)
           ========================================= */
        @media print {
            @page {
                margin: 0;
            }
            body {
                background: none;
                padding: 0;
                margin: 0;
                width: 100%;
                font-family: 'Courier New', Courier, monospace;
                font-size: 12px;
                color: black;
            }
            .controls { display: none !important; }
            
            h1 {
                font-size: 16px;
                text-align: center;
                margin: 10px 0;
                border-bottom: 2px dashed black;
                padding-bottom: 5px;
                color: black;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th, td {
                text-align: left;
                padding: 4px 2px;
                border-bottom: 1px dashed black;
                word-wrap: break-word;
            }
            th {
                font-weight: bold;
                border-bottom: 2px solid black;
            }
            .delay, .info-text { font-weight: bold; color: black; }
            
            #printFooter {
                display: block;
                text-align: center;
                margin-top: 15px;
                font-size: 10px;
                border-top: 1px dashed black;
                padding-top: 5px;
            }
        }
    </style>
</head>
<body>

    <h1 id="stationTitle">Abfahrtstafel</h1>
    
    <div class="controls">
        <select id="stationSelect" onchange="ladeAbfahrten()"></select>
        <button onclick="ladeAbfahrten()">Aktualisieren 🔄</button>
        <button onclick="druckeFahrplan()">Fahrplan Drucken 🖨️</button>
    </div>

    <table id="abfahrtenTable">
        <thead>
            <tr>
                <th>Zeit</th>
                <th>Linie</th>
                <th>Ziel</th>
                <th>Gl.</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="4">Bitte Station wählen...</td></tr>
        </tbody>
    </table>

    <div id="printFooter">
        Gute Reise! <br>
        <span id="printTime"></span>
    </div>

    <script>
        const GITHUB_BASE_URL = "https://raw.githubusercontent.com/nicopro2021/Abfahrtstafel-/main/";

        const LOCAL_STATIONS = [
            { name: "Bad Belzig", file: "bad_belzig.json" }, { name: "Berlin Hbf", file: "berlin_hbf.json" },
            { name: "Biederitz", file: "biederitz.json" }, { name: "Bitterfeld", file: "bitterfeld.json" },
            { name: "Brandenburg Hbf", file: "brandenburg_hbf.json" }, { name: "Dessau Hbf", file: "dessau_hbf.json" },
            { name: "Dessau Süd", file: "dessau_sued.json" }, { name: "Gommern", file: "gommern.json" },
            { name: "Güterglück", file: "gueterglueck.json" }, { name: "Leipzig Hbf", file: "leipzig_hbf.json" },
            { name: "Leipzig Hbf (tief)", file: "leipzig_hbf_tief.json" }, { name: "Magdeburg Hbf", file: "magdeburg_hbf.json" },
            { name: "Magdeburg Herrenkrug", file: "magdeburg_herrenkrug.json" }, { name: "Magdeburg Neustadt", file: "magdeburg_neustadt.json" },
            { name: "Pretzier (Altm)", file: "pretzier_altm.json" }, { name: "Rodleben", file: "rodleben.json" },
            { name: "Roßlau (Elbe)", file: "rosslau.json" }, { name: "Wolfen", file: "wolfen.json" },
            { name: "Wusterwitz", file: "wusterwitz.json" }, { name: "Zerbst/Anhalt", file: "zerbst.json" }
        ];

        function initDropdown() {
            const select = document.getElementById('stationSelect');
            LOCAL_STATIONS.forEach(station => {
                const option = document.createElement('option');
                option.value = station.file;
                option.textContent = station.name;
                
                if (station.name === "Zerbst/Anhalt") {
                    option.selected = true;
                }
                
                select.appendChild(option);
            });
        }

        async function ladeAbfahrten() {
            const select = document.getElementById('stationSelect');
            const selectedFile = select.value;
            const selectedName = select.options[select.selectedIndex].text;
            
            document.getElementById('stationTitle').textContent = 'Abfahrten: ' + selectedName;
            
            const tbody = document.querySelector('#abfahrtenTable tbody');
            tbody.innerHTML = '<tr><td colspan="4">Daten werden geladen...</td></tr>';

            try {
                const url = GITHUB_BASE_URL + selectedFile;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Netzwerkfehler');
                
                const data = await response.json();
                tbody.innerHTML = '';

                const fahrten = Array.isArray(data) ? data : (data.abfahrten || []); 
                
                if (fahrten.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Keine aktuellen Abfahrten gefunden.</td></tr>';
                    return;
                }

                fahrten.forEach(zug => {
                    const tr = document.createElement('tr');
                    
                    // 1. Zeit-Logik: Planzeit vs Echte Zeit
                    let zeitAnzeige = zug.zeit || '-';
                    if (zug.echte_zeit && zug.echte_zeit !== zug.zeit) {
                        zeitAnzeige += ` <br><span class="delay">(heute ${zug.echte_zeit})</span>`;
                    }

                    // 2. Info & Begründung
                    let zusatzInfo = "";
                    if (zug.info && zug.info.toLowerCase() !== "pünktlich") {
                        zusatzInfo = `<br><span class="info-text">⚠ ${zug.info}`;
                        if (zug.begruendung) {
                            zusatzInfo += ` - ${zug.begruendung}`;
                        }
                        zusatzInfo += `</span>`;
                    }

                    tr.innerHTML = `
                        <td>${zeitAnzeige}</td>
                        <td><strong>${zug.linie || '-'}</strong></td>
                        <td>${zug.ziel || '-'}${zusatzInfo}</td>
                        <td>${zug.gleis || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Fehler:', error);
                tbody.innerHTML = '<tr><td colspan="4" style="color:red;">Fehler beim Laden der Daten von GitHub.</td></tr>';
            }
        }

        function druckeFahrplan() {
            const jetzt = new Date();
            document.getElementById('printTime').textContent = "Stand: " + jetzt.toLocaleString('de-DE');
            window.print();
        }

        // Initialisierung
        initDropdown();
        ladeAbfahrten();
        
        // Refresh alle 60 Sekunden
        setInterval(ladeAbfahrten, 60000);
    </script>
</body>
</html>
